modules:
  rovo:agent:
    - key: bezen-reply-reader
      name: BEZEN Reply Reader
      description: Reads a customer's reply and says what they are protecting, what
        not to do now, and whether a bot or a human should answer. Every claim
        quotes their own words, checked by code.
      prompt: resource:agent-resource;prompt.txt
      conversationStarters:
        - Read the customer's latest reply on this request
        - Should a bot or a human answer this customer?
        - What is this customer protecting?
      actions:
        - get-customer-reply
        - check-reading
  action:
    - key: get-customer-reply
      name: Get customer reply
      function: getCustomerReply
      actionVerb: GET
      description: |
        Fetch the customer's latest reply on a Jira request, together with readings already made on this request.
        Call this before reading any reply.
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: "Key of the request to read, for example SUP-12. Leave empty when
            the user is viewing the request."
    - key: check-reading
      name: Check reading
      function: checkReading
      actionVerb: GET
      description: |
        Submit a reading to the BEZEN critic, which checks the evidence is a verbatim quote of the reply and logs
        the decision. Returns pass, rejected (one more try) or escalated (a human must read it).
      inputs:
        issueKey:
          title: Issue key
          type: string
          required: false
          description: "Key of the request that was read. Leave empty when the user is
            viewing the request."
        sort:
          title: Sort
          type: string
          required: true
          description: "yes, no or question"
        state:
          title: State
          type: string
          required: true
          description: "burned_before, intrusion, guilt_or_loss, price_ultimatum,
            overloaded, career_risk, flat_no, casual_yes or other"
        protecting:
          title: Protecting
          type: string
          required: true
          description: "One sentence: what the person is protecting"
        evidence:
          title: Evidence
          type: string
          required: true
          description: "The exact words from the reply that show it, copied character for
            character"
        dont:
          title: Do not
          type: string
          required: true
          description: "One sentence: what must not be done now"
        send:
          title: Who answers
          type: string
          required: true
          description: "auto (a bot may answer), human (a human must answer) or none
            (nobody answers)"
        confidence:
          title: Confidence
          type: number
          required: true
          description: "0 to 1, how sure the reading is"
        message:
          title: Next message
          type: string
          required: false
          description: "The next message to the customer, 1-3 sentences, or empty when
            send is none"
  jira:issuePanel:
    - key: bezen-reply-panel
      resource: panel-resource
      resolver:
        function: panel
      render: native
      title: BEZEN Reply Reader
      icon: https://developer.atlassian.com/platform/forge/images/icons/issue-panel-icon.svg
  function:
    - key: getCustomerReply
      handler: index.getCustomerReply
    - key: checkReading
      handler: index.checkReading
    - key: panel
      handler: index.panel
resources:
  - key: panel-resource
    path: src/frontend/index.jsx
  - key: agent-resource
    path: resource/agent
app:
  runtime:
    name: nodejs22.x
  id: ari:cloud:ecosystem::app/1826110f-f4a8-4611-a9bc-531f8d5c81b2
permissions:
  scopes:
    - read:jira-work
    - write:jira-work
    - read:jira-user
